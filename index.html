<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
</head>
<body>

    <h1>Student Event Registration</h1>

    <h2>Tech Fest 2026</h2>

    <p>
        Join our annual technical event featuring coding,
        technology and innovation activities.
    </p>

    <form>

        <label>Student Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Register Number:</label>
        <input type="text" name="register">
        <br><br>

        <label>Department:</label>
        <input type="text" name="department">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Event Date:</label>
        <input type="date" name="date">
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
